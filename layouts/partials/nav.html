<nav class="nav-top small">
  <div class="logo">
    {{- /* 想换成签名图：把 <img> 放进 <a> 里，样式已就绪
         <img src="{{ "images/logo.png" | relURL }}" alt="{{ site.Params.author }}"> */}}
    <a href="{{ "/" | relURL }}">{{ site.Params.author }}</a>
  </div>
  <div class="menu">
    {{- /* 当前页加 class="active"，靠 Section 判断。
           首页用 .IsHome；其他页 .Section 等于 content/ 下的目录名。 */}}
    <span{{ if .IsHome }} class="active"{{ end }}><a href="{{ "/" | relURL }}">首页</a></span>
    <span{{ if eq .Section "about" }} class="active"{{ end }}><a href="{{ "about/" | relURL }}">关于</a></span>
    <span{{ if eq .Section "blog" }} class="active"{{ end }}><a href="{{ "blog/" | relURL }}">日志</a></span>
    <span><a href="{{ "about/" | relURL }}#联系">联系</a></span>
  </div>
</nav>
